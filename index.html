<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BuildPass</title>
<meta name="apple-mobile-web-app-title" content="BuildPass">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{
  --bg:#f6f6fb; --panel:#ffffff; --panel2:#f1eeff; --line:#e7e4f6;
  --txt:#1c1b2e; --dim:#71708c; --accent:#6c5ce7; --accent2:#00c2a8;
  --green:#12c17a; --red:#ff4d6d; --amber:#ffa800;
  --radius:20px; --radius-sm:12px;
  --shadow:0 1px 2px rgba(28,22,70,.05), 0 8px 20px rgba(28,22,70,.07);
  --shadow-pop:0 10px 26px rgba(108,92,231,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:100px}
header{padding:calc(16px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(180deg,#efe9ff,var(--bg));border-bottom:1px solid var(--line)}
header h1{font-size:21px;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,var(--accent),#9b6cff);-webkit-background-clip:text;background-clip:text;color:transparent}
header .sub{color:var(--dim);font-size:12px;font-weight:600}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:50;box-shadow:0 -4px 16px rgba(28,22,70,.06)}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:10px 0 max(12px,env(safe-area-inset-bottom));font-size:11px;font-weight:700;cursor:pointer;transition:color .15s}
nav button.on{color:var(--accent)}
nav button[hidden]{display:none}
nav button .ic{display:block;font-size:22px;margin-bottom:2px;transition:transform .15s}
nav button.on .ic{transform:translateY(-2px) scale(1.1)}
main{max-width:680px;margin:0 auto;padding:10px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-pop)}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);min-height:290px;padding:28px 24px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;position:relative;box-shadow:var(--shadow);border-top:5px solid var(--accent)}
.fcard .tag{position:absolute;top:16px;left:18px;font-size:11px;color:#fff;background:var(--accent);padding:3px 10px;border-radius:999px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.fcard .src{position:absolute;bottom:14px;right:18px;font-size:11px;color:var(--dim)}
.fcard .q{font-size:19px;font-weight:700;line-height:1.45;margin-top:14px}
.fcard .a{font-size:16px;color:#0a9e63;margin-top:16px;padding-top:16px;border-top:2px dashed var(--line);line-height:1.5;font-weight:600}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--panel);color:var(--txt);font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.good{color:#fff;background:var(--green);border-color:var(--green)}
.btn.bad{color:#fff;background:var(--red);border-color:var(--red)}
.btn.pri{background:linear-gradient(135deg,var(--accent),#9b6cff);border-color:var(--accent);color:#fff;box-shadow:var(--shadow-pop)}
.meta-line{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;margin-top:10px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;margin-bottom:6px;font-weight:800}
.panel .hint{color:var(--dim);font-size:12px;margin-bottom:4px}
.bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.list-item:last-child{border-bottom:none}
.list-item .t{font-weight:700;font-size:14px}
.list-item .d{color:var(--dim);font-size:12px}
.list-item.playing .t{color:var(--accent)}
.play-ic{color:var(--accent);font-size:20px;flex:0 0 auto}
.player{position:sticky;top:8px;z-index:10;background:linear-gradient(160deg,#efe9ff,var(--panel));border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-top:8px;box-shadow:var(--shadow-pop)}
.player .title{font-weight:800;font-size:14px;min-height:18px}
.player .now{font-size:12px;color:var(--dim);min-height:16px;font-weight:600}
.seek{width:100%;margin-top:10px;accent-color:var(--accent)}
.tp{display:flex;align-items:center;gap:12px;margin-top:10px;justify-content:center}
.tp button{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:50%;width:46px;height:46px;font-size:15px;cursor:pointer;font-weight:800;box-shadow:var(--shadow)}
.tp button.big{width:60px;height:60px;background:linear-gradient(135deg,var(--accent),#9b6cff);border-color:var(--accent);font-size:22px;color:#fff;box-shadow:var(--shadow-pop)}
.tp .rate{width:auto;border-radius:999px;padding:0 14px;font-size:13px}
select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px}
.opt-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:13px;color:var(--dim)}
.big-num{font-size:36px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--dim);font-size:11px;font-weight:800;letter-spacing:.05em}
.pass{color:#0a9e63} .fail{color:#e0304f}
.para-live{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:12px;font-size:16px;line-height:1.65;box-shadow:var(--shadow)}
.caps{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 16px;margin-top:12px;max-height:44vh;overflow-y:auto;scroll-behavior:smooth;box-shadow:var(--shadow)}
.cap{padding:10px 2px;color:var(--dim);font-size:15px;line-height:1.55;border-bottom:1px solid var(--line);cursor:pointer;transition:color .2s}
.cap:last-child{border-bottom:none}
.cap.on{color:var(--txt);font-weight:700}
.cap.on::before{content:"▸ ";color:var(--accent)}
.cap .qa{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--accent);margin-right:6px}
.qopt{display:block;width:100%;text-align:left;padding:14px 16px;margin-top:8px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--panel);color:var(--txt);font-size:15px;cursor:pointer;font-weight:600;transition:all .12s}
.qopt:active{transform:scale(.98)}
.qopt.right{border-color:var(--green);color:#0a9e63;background:rgba(18,193,122,.08);font-weight:800}
.qopt.wrong{border-color:var(--red);color:#e0304f;background:rgba(255,77,109,.08);font-weight:800}
.qwhy{margin-top:10px;padding:14px;border-radius:var(--radius-sm);background:var(--panel2);border:1px solid var(--line);color:var(--txt);font-size:13px;line-height:1.5}
.badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:999px}
.badge.pass{background:rgba(18,193,122,.14);color:#0a9e63} .badge.fail{background:rgba(255,77,109,.14);color:#e0304f}
.hide{display:none}
.empty{color:var(--dim);text-align:center;padding:40px 20px;font-weight:600}
.pill{font-size:10px;font-weight:800;letter-spacing:.05em;padding:3px 10px;border-radius:999px;border:1.5px solid var(--line);color:var(--dim)}
.pill.hd{color:#0a9e63;border-color:#0a9e63;background:rgba(18,193,122,.1)}
.trk{margin-left:auto;display:flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.trk button{background:none;border:none;color:var(--dim);font-size:12px;font-weight:800;padding:6px 14px;cursor:pointer}
.trk button.on{background:var(--accent);color:#fff}
.notice{background:rgba(108,92,231,.07);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-top:12px;color:var(--txt);font-size:13px;line-height:1.5}

/* ===== Read (ebook) ===== */
.rdlist{display:flex;flex-direction:column;gap:8px}
.rdrow{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:13px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;box-shadow:var(--shadow)}
.rdrow:active{background:var(--panel2)}
.rdnum{flex:0 0 34px;height:34px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--dim)}
.rdrow.done .rdnum{background:rgba(18,193,122,.14);border-color:rgba(18,193,122,.4);color:#0a9e63}
.rdmeta{flex:1;min-width:0}
.rdttl{font-weight:700;font-size:14px;line-height:1.3}
.rdsub{font-size:11px;color:var(--dim);margin-top:3px}
.rdbar{height:4px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.rdbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px}
.rdtop{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:8px 0 9px;margin:-4px 0 14px}
.rdtop b{flex:1;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:999px;
  padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.rdprog{position:fixed;left:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));z-index:60;transition:width .12s}
#rdbody{font-size:var(--rdfs,17px);line-height:1.72;max-width:42em;margin:0 auto;padding-bottom:40px}
#rdbody p{margin:0 0 1.05em}
#rdbody h3{font-size:.78em;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  margin:2em 0 .7em;font-weight:800}
#rdbody h3:first-child{margin-top:0}
.rdq{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--amber);
  border-radius:var(--radius-sm);padding:14px 15px;margin:1.4em 0}
.rdq .qq{font-weight:700}
.rdq button{margin-top:10px;background:var(--panel);border:1px solid var(--line);color:#b5790a;
  border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer}
.rdq .ans{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);color:var(--txt)}
.rdend{margin-top:26px;display:flex;gap:9px;flex-wrap:wrap}
</style>
</head>
<body>
<header><svg width="26" height="26" viewBox="0 0 180 180" style="flex:0 0 auto;align-self:center;border-radius:7px"><rect width="180" height="180" rx="40" fill="#6c5ce7"/><path d="M45 102 C45 74 65 54 90 54 C115 54 135 74 135 102 Z" fill="#f5a623"/><rect x="82" y="46" width="16" height="34" rx="8" fill="#f5a623"/><rect x="32" y="102" width="116" height="14" rx="7" fill="#f5a623"/><path d="M62 138 L82 156 L120 122" fill="none" stroke="#2fd282" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg><h1 id="appTitle">BuildPass</h1><span class="sub" id="bankMeta"></span>
  <div class="trk" id="trk"><button data-t="builder">🏗 Builder</button><button data-t="law">⚖️ Law</button><button data-t="thinking">🧠 Thinking</button><button data-t="social">🤝 Social</button></div></header>
<main id="main"></main>
<nav>
  <button data-v="plan" class="on"><span class="ic">📅</span>Plan</button>
  <button data-v="audio"><span class="ic">🎧</span>Listen</button>
  <button data-v="read"><span class="ic">📖</span>Read</button><button data-v="study"><span class="ic">🃏</span>Study</button>
  <button data-v="quiz"><span class="ic">⏱</span>Quiz</button>
  <button data-v="stats"><span class="ic">📊</span>Stats</button>
</nav>
<audio id="mp3" preload="metadata"></audio>
<script>const MP3_OVERRIDE="audio/";</script>
<script src="bank.js"></script>
<script src="read.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const el = h => { const d = document.createElement('div'); d.innerHTML = h; return d.firstElementChild; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BANK = (typeof BANK2 !== 'undefined') ? BANK2 : {meta:{},domains:[],cards:[],lectures:[]};
const MP3_BASE = (typeof MP3_OVERRIDE !== 'undefined') ? MP3_OVERRIDE : '../corpus/audio/mp3/';
const EMPTY = {domains:[],cards:[],lectures:[],quizzes:{},mcq:{}};
/* Several tracks share one app. Builder = the PSI Residential Builder exam (official pass 72.5%).
   Law = Michigan insurance law (no official exam; 80% is Jacob's own mastery line).
   Thinking = critical thinking / LSAT-style logic (no official exam; 80% is Jacob's own mastery line).
   Social is read-only (see below). */
const TRACKS = {
  builder:{title:'BuildPass', artist:'BuildPass', store:'mib2', mp3:'',
    data:()=>BANK, sections:[['all','B&L + Trade'],['bl','Business & Law'],['trade','Trade']], secLabel:{bl:'B&L',trade:'Trade'},
    cram:'🔥 Cram top-200', pass:72.5, passWord:'exam pass line 72.5%', sims:[25,50,160], simNote:'Real exam: 160 questions, 240 minutes, one combined sitting.',
    quizLine:'need 72.5%', exams:'30 questions'},
  law:{title:'BuildPass · Law', artist:'BuildPass Law', store:'milaw1', mp3:'law_',
    data:()=>(BANK.tracks&&BANK.tracks.law)||EMPTY, sections:[['all','Rules + Apply'],['rule','Rules & cites'],['apply','Apply it']], secLabel:{rule:'Rule',apply:'Apply'},
    cram:'🔥 Cram: the numbers', pass:80, passWord:'mastery line 80% (no official exam)', sims:[25,50,100], simNote:'No official exam for this track. 80% is the mastery line; every card cites its statute or case.',
    quizLine:'mastery line 80%', exams:'20 questions'},
  thinking:{title:'BuildPass · Thinking', artist:'BuildPass Thinking', store:'mithink1', mp3:'think_',
    data:()=>(BANK.tracks&&BANK.tracks.thinking)||EMPTY, sections:[['all','Concept + Drill'],['concept','Concepts'],['drill','Drills']], secLabel:{concept:'Concept',drill:'Drill'},
    cram:'🔥 Cram: the rules', pass:80, passWord:'mastery line 80% (not an LSAT score)', sims:[25,50,100], simNote:'No official exam for this track. 80% is the mastery line; it is not an LSAT score prediction.',
    quizLine:'mastery line 80%', exams:'20 questions'},
  /* Social is a READ-ONLY track: the operator-stack chapters on approaching people, holding a
     conversation, humour, power and rejection. There are no cards, no audio and no quiz for it,
     so every other tab is hidden while it is selected and the app parks on 📖 Read. */
  social:{title:'BuildPass · Social', artist:'BuildPass Social', store:'misoc1', mp3:'', readOnly:true,
    data:()=>EMPTY, sections:[['all','All']], secLabel:{},
    cram:'', pass:0, passWord:'', sims:[], simNote:'', quizLine:'', exams:''},
};
let trackId = new URLSearchParams(location.search).get('track')||localStorage.getItem('examos_track')||'builder'; if(!TRACKS[trackId]) trackId='builder';
let T=TRACKS[trackId], B=T.data(), store={};
function loadStore(){
  store = JSON.parse(localStorage.getItem(T.store)||'{}');
  store.cards = store.cards||{}; store.quiz = store.quiz||[]; store.pos = store.pos||{}; store.plan = store.plan||{};
}
loadStore();
const save = () => localStorage.setItem(T.store, JSON.stringify(store));
function trackChrome(){
  // A read-only track has nothing to show on Listen/Study/Quiz/Stats, so those tabs are hidden
  // rather than left to render an empty screen. Plan is builder-only (it's the PSI exam sprint).
  document.querySelectorAll('nav button').forEach(b => {
    if(b.dataset.v==='plan'){ b.hidden = trackId!=='builder'; return; }
    b.hidden = !!T.readOnly && b.dataset.v !== 'read';
  });
}
function paintHeader(){
  $('#appTitle').textContent = T.title;
  const rd = (typeof READ !== 'undefined' && READ[trackId]) ? READ[trackId] : [];
  $('#bankMeta').textContent = T.readOnly
    ? `${rd.length} chapters · ${Math.round(rd.reduce((a,c)=>a+c.words,0)/200)} min read`
    : `${B.cards.length} cards · ${B.lectures.length} chapters`;
  trackChrome();
  document.querySelectorAll('#trk button').forEach(b=>b.classList.toggle('on',b.dataset.t===trackId));
  document.title = T.title;
}
function switchTrack(id){
  if(!TRACKS[id]||id===trackId) return;
  try{ mp3.pause(); }catch(e){}
  if(window.speechSynthesis) speechSynthesis.cancel();
  AP.track=null; AP.quiz=null; AP.cues=null; AP.mp3ok=null;
  trackId=id; T=TRACKS[id]; B=T.data(); localStorage.setItem('examos_track',id);
  loadStore(); fDomain='all'; fSection='all'; cur=null; flipped=false; qz=null; mz=null;
  rdOpen=null; window.onscroll=null;
  if(view==='plan' && id!=='builder') view='audio';
  if(T.readOnly && view!=='read') view='read';
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===view));
  paintHeader(); views[view]();
}
document.querySelectorAll('#trk button').forEach(b=>b.onclick=()=>switchTrack(b.dataset.t));
const scoreOf = id => store.cards[id]?.s ?? 0;
const domLabel = d => d.replace(/^\d+_/,'').replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const fmt = t => isFinite(t) ? `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}` : '–:–';

let fDomain='all', fSection='all';
const pool = () => B.cards.filter(c => (fDomain==='all'||(fDomain==='cram'?c.cram:c.domain===fDomain)) && (fSection==='all'||c.section===fSection));
const hasCram = () => B.cards.some(c=>c.cram);
const mcqPool = () => Object.entries(B.mcq||{}).filter(([d])=>fDomain==='all'||fDomain==='cram'||d===fDomain).flatMap(([d,qs])=>qs.map(q=>({...q,domain:d})));
function weightedPick(cards){
  const w = cards.map(c => Math.max(1, 6 - scoreOf(c.id)));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<cards.length;i++){ r-=w[i]; if(r<=0) return cards[i]; }
  return cards[cards.length-1];
}
function chipsHTML(){
  const s=T.sections.map(([v,l])=>`<button class="chip ${fSection===v?'on':''}" data-s="${v}">${l}</button>`).join('');
  const d=['all',...(hasCram()?['cram']:[]),...B.domains].map(x=>`<button class="chip ${fDomain===x?'on':''}" data-d="${x}">${x==='all'?'All domains':x==='cram'?T.cram:domLabel(x)}</button>`).join('');
  return `<div class="chips">${s}</div><div class="chips">${d}</div>`;
}
function bindChips(root,rr){
  root.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{fDomain=b.dataset.d;rr();});
  root.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{fSection=b.dataset.s;rr();});
}

/* ============ AUDIO (MP3 audiobook, TTS fallback) ============ */
const mp3 = $('#mp3');
let AP = { track:null, list:[], mp3ok:null, cues:null, capIdx:-1, quiz:null };   // track = {id,title,file,kind}
const cueCache = {};
function loadCues(t){
  AP.cues=null; AP.capIdx=-1;
  const url=t.file.replace(/\.mp3$/,'.cues.json');
  if(cueCache[t.file]){ AP.cues=cueCache[t.file]; renderCaps(); return; }
  if(!location.protocol.startsWith('http')) return;
  fetch(url).then(r=>r.ok?r.json():null).then(j=>{
    if(!j) return;
    const cues=(j.paras||j.items||[]).map(c=>({t:c.t,text:c.text,type:c.type||'p'}));
    cueCache[t.file]=cues;
    if(AP.track&&AP.track.id===t.id){ AP.cues=cues; renderCaps(); }
  }).catch(()=>{});
}
function domainOf(t){ return t.id.replace(/_(lecture|drill)$/,''); }
function quizFor(t){ return (B.quizzes||{})[domainOf(t)]||null; }
function tracks(){
  const lec = B.lectures.map(L=>({id:L.id,title:L.title,file:MP3_BASE+T.mp3+L.id+'.mp3',kind:'Chapter',words:L.words,paras:L.paras}));
  const drl = B.domains.map(d=>({id:d+'_drill',title:domLabel(d)+' — drill',file:MP3_BASE+T.mp3+d+'_drill.mp3',kind:'Drill'}));
  const exm = Object.keys(B.mcq||{}).map(d=>({id:d+'_exam',title:domLabel(d)+' — audio exam',file:MP3_BASE+T.mp3+d+'_exam.mp3',kind:'Exam'}));
  return {lec,drl,exm};
}

function ttsChapter(t){ // device-voice fallback for one chapter, with follow-along captions
  const synth=window.speechSynthesis; if(!synth) return;
  synth.cancel(); try{ mp3.pause(); }catch(e){}
  AP.track={...t,tts:true}; AP.quiz=null;
  AP.cues=t.paras.map((p,i)=>({t:i,text:p,type:'p'})); AP.capIdx=-1;
  renderAudio(); renderCaps();
  let i=0, on=true;
  const speak=()=>{ if(!on||i>=t.paras.length){ if(on&&quizFor(t)) startQuiz(t); return; }
    AP.capIdx=i; const w=$('#caps'); if(w){ w.querySelectorAll('.cap.on').forEach(x=>x.classList.remove('on')); const cu=w.querySelector(`[data-ci="${i}"]`); if(cu){cu.classList.add('on');cu.scrollIntoView({block:'center',behavior:'smooth'});} }
    const u=new SpeechSynthesisUtterance(t.paras[i]); u.rate=+(store.rate||1); u.onend=()=>{i++;speak();}; synth.speak(u); };
  speak();
  const stop=()=>{on=false;synth.cancel();};
  AP.stopTTS=stop;
}
function ttsLectures(){ // fallback only
  const synth=window.speechSynthesis; if(!synth) return;
  let li=0,pi=0,on=true;
  const next=()=>{ if(!on)return; const L=B.lectures[li]; if(!L)return;
    if(pi>=L.paras.length){li++;pi=0;return next();}
    const u=new SpeechSynthesisUtterance(L.paras[pi]); u.rate=+(store.rate||1);
    u.onend=()=>{pi++;next();}; synth.speak(u); };
  synth.cancel(); next();
  const stop=()=>{on=false;synth.cancel();document.removeEventListener('visibilitychange',stop);};
}

    </div>
    <div class="panel"><h3>Domain mastery</h3>
      ${byDom.map(x=>`<div style="margin-top:10px"><div class="meta-line" style="margin:0"><span>${domLabel(x.d)}</span><span>${x.mastered}/${x.total}</span></div><div class="bar"><i style="width:${x.total?Math.round(100*x.mastered/x.total):0}%"></i></div></div>`).join('')}
    </div>
    <div class="panel"><div class="row"><button class="btn bad" id="wipe">Reset all progress</button></div></div>
  </div>`));
  $('#wipe').onclick=()=>{ if(confirm(`Wipe all ${T.title} progress?`)){localStorage.removeItem(T.store);location.reload();} };
}

/* ============ PLAN — 2-3 week fast track ============ */
/* Built from the official PSI content weights (README) + a domain-by-domain pass that split the
   220-card cram set into true rote (a regulator picked the number, no shortcut) vs formulas/concepts
   a builder can rebuild live (markup/margin, takeoff math, swell/shrink, U=1/R). Days are self-paced
   checkboxes, not calendar-locked — he has a job, some days slip. */
function tb(label,pt,pd,pn){ return `<button class="chip" data-pt="${pt}" data-pd="${pd||''}" ${pn?`data-pn="${pn}"`:''}>${esc(label)}</button>`; }
const PLAN_DAYS = [

function viewPlan(){
  const m=$('#main');
  const doneN = PLAN_DAYS.filter(x=>x.core && store.plan[x.d]).length;
  const coreN = PLAN_DAYS.filter(x=>x.core).length;
  m.innerHTML = `<div class="panel">
      <h3>📅 2-3 week fast track</h3>
      <div class="hint" style="margin-top:6px">You don't need all 791 cards cold. Around 165-180 of the 220 cram cards are true rote — a regulator picked the number, no logic connects it — mostly Licensing Law, MIOSHA, Masonry/Roofing/Siding, and Carpentry/Framing's stair and tie numbers. The rest — markup/margin math, takeoff formulas, swell/shrink, U-factor — you learn as one rule each and rebuild it live. That split is what this tab is built around. Each day's question-count is that domain's own blueprint weight from the corpus, checked against the PSI candidate bulletin.</div>
      <div class="meta-line" style="margin-top:10px"><span>Core days done</span><span>${doneN}/${coreN}</span></div>
      <div class="bar"><i style="width:${coreN?Math.round(100*doneN/coreN):0}%"></i></div>
    </div>
    ${PLAN_DAYS.filter(x=>x.core).map(dayPanel).join('')}
    <div class="panel"><h3>If you need more time</h3><div class="hint">Use 2+ days' notice to move your PSI date rather than sit it under the line.</div></div>
    ${PLAN_DAYS.filter(x=>!x.core).map(dayPanel).join('')}
  `;
  bindPlan(m);
}
function dayPanel(x){
  const done = !!store.plan[x.d];
  return `<div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <h3>Day ${x.d} — ${esc(x.ttl)}</h3>
      <span class="pill ${done?'hd':''}">${done?'✓ done':x.mins+' min'}</span>
    </div>
    ${x.note?`<div class="notice">${esc(x.note)}</div>`:''}
    <ul style="margin:10px 0 0 18px;line-height:1.7;font-size:14px">${x.tasks.map(t=>`<li>${t}</li>`).join('')}</ul>
    ${x.gate?`<div class="notice" style="border-left:3px solid var(--amber)">🎯 ${esc(x.gate)}</div>`:''}
    <div class="row"><button class="btn ${done?'':'pri'}" data-done="${x.d}">${done?'Mark not done':'✓ Mark day done'}</button></div>
  </div>`;
}
function bindPlan(m){
  m.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>planAction(b.dataset.pt,b.dataset.pd,+b.dataset.pn||undefined));
  m.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{ const d=+b.dataset.done; store.plan[d]=!store.plan[d]; save(); viewPlan(); });
}
function planAction(type,dom,n){
  if(type==='study'){ fDomain=dom||'cram'; setView('study'); }
  else if(type==='mcq'){ fDomain=dom||'cram'; setView('quiz'); startMC(n||10); }
  else if(type==='sim'){ fDomain='all'; setView('quiz'); startSim(n||160); }
}


/* ============ Read — the lectures as an ebook ============ */
/* Same teaching scripts the Listen tab plays, with the text-to-speech spelling undone by
   tools/make_readable.py and every citation re-checked by tools/verify_readable.py. */
const RD = () => (typeof READ !== 'undefined' && READ[trackId]) ? READ[trackId] : [];
let rdOpen = null;              // chapter id currently being read
let rdFS = +(localStorage.getItem('examos_rdfs') || 17);

function rdState(id){ store.read = store.read||{}; return store.read[id] = store.read[id]||{p:0}; }
function rdMins(w){ return Math.max(1, Math.round(w/200)); }   // ~200 wpm silent reading

function renderRead(){
  const chs = RD();
  if(!chs.length){
    $('#main').innerHTML = `<div class="card"><b>No reading text yet</b><div class="sub"
      style="margin-top:6px">This track has no chapters built. Run tools/make_readable.py.</div></div>`;
    return;
  }
  if(rdOpen) return rdChapter();

  const rows = chs.map((c,i)=>{
    const st = rdState(c.id), pct = Math.round((st.p||0)*100);
    const ideas = c.blocks.filter(b=>b.t==='h').length;
    return `<button class="rdrow ${pct>=98?'done':''}" data-i="${i}">
      <div class="rdnum">${pct>=98?'✓':String(i).padStart(2,'0')}</div>
      <div class="rdmeta">
        <div class="rdttl">${esc(c.title)}</div>
        <div class="rdsub">${rdMins(c.words)} min${ideas?` · ${ideas} ideas`:''}${c.questions?` · ${c.questions} questions`:''}${
          pct>0&&pct<98?` · <span style="color:var(--accent)">${pct}% read</span>`:''}</div>
        ${pct>0?`<div class="rdbar"><i style="width:${pct}%"></i></div>`:''}
      </div></button>`;
  }).join('');

  const doneN = chs.filter(c=>(rdState(c.id).p||0)>=.98).length;
  const totMin = rdMins(chs.reduce((a,c)=>a+c.words,0));
  $('#main').innerHTML = `
    <div class="card" style="margin-bottom:12px">
      <b>📖 ${esc(T.title)} — read it</b>
      <div class="sub" style="margin-top:6px">The same lessons the Listen tab plays, as text.
        ${chs.length} chapters · about ${totMin} minutes of reading · ${doneN} finished.${
          chs.some(c=>c.questions) ? ' Questions are hidden until you tap.' : ''}</div>
    </div>
    <div class="rdlist">${rows}</div>`;
  document.querySelectorAll('.rdrow').forEach(b=>b.onclick=()=>{ rdOpen = chs[+b.dataset.i].id; rdChapter(); });
}

function rdChapter(){
  const chs = RD(), c = chs.find(x=>x.id===rdOpen);
  if(!c){ rdOpen=null; return renderRead(); }
  const idx = chs.indexOf(c), st = rdState(c.id);

  /* A question and its answer are two consecutive blocks. The answer is written straight
     into the question box (hidden) rather than parked in a <template> — a template's text
     lives in .content, so .textContent reads empty and the reveal shows nothing. */
  const parts = [];
  for(let i=0;i<c.blocks.length;i++){
    const b = c.blocks[i];
    if(b.t==='h'){ parts.push(`<h3>${esc(b.s)}</h3>`); continue; }
    if(b.t==='a'){ continue; }                      // consumed by its question
    if(b.t==='q'){
      const nx = c.blocks[i+1];
      const ans = (nx && nx.t==='a') ? nx.s : '';
      parts.push(`<div class="rdq"><div class="qq">${esc(b.s)}</div>
        <button type="button">Show answer</button>
        <div class="ans" hidden>${esc(ans)}</div></div>`);
      continue;
    }
    parts.push(`<p>${esc(b.s)}</p>`);
  }
  const body = parts.join('');

  $('#main').innerHTML = `
    <div class="rdprog" id="rdprog" style="width:0"></div>
    <div class="rdtop">
      <button class="rdbtn" id="rdback">‹ Chapters</button>
      <b>${esc(c.title)}</b>
      <button class="rdbtn" id="rdsm">A−</button><button class="rdbtn" id="rdlg">A+</button>
    </div>
    <div id="rdbody" style="--rdfs:${rdFS}px">${body}
      <div class="rdend">
        ${idx>0?`<button class="rdbtn" id="rdprev">‹ ${esc(chs[idx-1].title.slice(0,28))}</button>`:''}
        ${idx<chs.length-1?`<button class="rdbtn" id="rdnext" style="border-color:var(--accent);color:var(--accent)">Next: ${esc(chs[idx+1].title.slice(0,28))} ›</button>`:''}
        <button class="rdbtn" id="rddone">✓ Mark finished</button>
      </div>
    </div>`;

  document.querySelectorAll('.rdq button').forEach(b=>b.onclick=()=>{
    const a = b.parentElement.querySelector('.ans');
    a.hidden = !a.hidden; b.textContent = a.hidden ? 'Show answer' : 'Hide answer';
  });

  const setFS = v => { rdFS = Math.min(24, Math.max(14, v)); localStorage.setItem('examos_rdfs', rdFS);
                       $('#rdbody').style.setProperty('--rdfs', rdFS+'px'); };
  $('#rdsm').onclick = ()=>setFS(rdFS-1);
  $('#rdlg').onclick = ()=>setFS(rdFS+1);
  $('#rdback').onclick = ()=>{ rdOpen=null; window.onscroll=null; renderRead(); window.scrollTo(0,0); };
  const go = id => { rdOpen=id; window.onscroll=null; rdChapter(); window.scrollTo(0,0); };
  if($('#rdprev')) $('#rdprev').onclick = ()=>go(chs[idx-1].id);
  if($('#rdnext')) $('#rdnext').onclick = ()=>go(chs[idx+1].id);
  $('#rddone').onclick = ()=>{ st.p=1; save(); rdOpen=null; window.onscroll=null; renderRead(); window.scrollTo(0,0); };

  // progress = how far down the chapter you have scrolled; saved so it survives a reload
  let tick = 0;
  window.onscroll = () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = h > 0 ? Math.min(1, window.scrollY / h) : 1;
    $('#rdprog').style.width = (p*100)+'%';
    if(p > (st.p||0)) st.p = p;
    if(++tick % 12 === 0) save();
  };
  window.scrollTo(0,0);
  if((st.p||0) > .03 && (st.p||0) < .98){
    setTimeout(()=>{ const h=document.documentElement.scrollHeight-window.innerHeight;
                     window.scrollTo({top:h*st.p, behavior:'instant'}); }, 40);
  }
}

/* ============ router ============ */
let view = trackId==='builder' ? 'plan' : 'audio';
const views={plan:viewPlan,audio:renderAudio,read:renderRead,study:viewStudy,quiz:viewQuiz,stats:viewStats};
function setView(v){
  if(view==='read'){ window.onscroll=null; rdOpen=null; }
  view=v;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  views[view]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
if(T.readOnly) view='read';
paintHeader();
setView(view);
</script>
